<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - Conectados con Responsabilidad</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800 font-sans">
  <!-- Header -->
  <header class="bg-green-100 p-6 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold text-green-800">Conectados con Responsabilidad</h1>
      <nav class="space-x-4">
        <a href="index.html" class="text-green-700 hover:underline">Inicio</a>
        <a href="servicios.html" class="text-green-700 hover:underline">Servicios</a>
        <a href="nosotros.html" class="text-green-700 hover:underline">Nosotros</a>
        <a href="foro.html" class="text-green-700 hover:underline">Foro</a>
        <a href="contacto.html" class="text-green-700 hover:underline">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- Sección de Login -->
  <section class="max-w-md mx-auto py-16 px-6">
    <h2 class="text-3xl font-bold text-center text-green-900 mb-8">Iniciar sesión</h2>
    <p class="text-center text-gray-700 mb-10">Ingresa tus datos para acceder a tu cuenta.</p>
    
    <!-- Formulario de Login -->
    <form class="bg-green-50 p-8 rounded-xl shadow-md space-y-6" action="bienvenida.html" method="POST">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
        <input type="email" id="email" name="email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring focus:border-green-500">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input type="password" id="password" name="password" required class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring focus:border-green-500">
      </div>
      <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 transition">Iniciar sesión</button>
    </form>

    <div class="text-center mt-4">
      <p class="text-sm text-gray-700">¿No tienes cuenta? <a href="signup.html" class="text-green-600 hover:underline">Regístrate aquí</a></p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-green-100 text-center py-6 text-green-700">
    © 2025 Conectados con Responsabilidad. Todos los derechos reservados.
  </footer>
</body>
</html>
